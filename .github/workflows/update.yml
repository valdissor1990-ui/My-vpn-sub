name: Update Subscription

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'config.py'
      - 'bots/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

concurrency:
  group: update-subscription
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install telethon || true

      - name: Run full pipeline
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
        run: python collector.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt sub_vision.txt sub_white.txt sub_black.txt sub_hy2.txt sub_reality.txt \
            sub_base64.txt sub_vision_base64.txt sub_white_base64.txt sub_black_base64.txt \
            sub_hy2_base64.txt sub_reality_base64.txt \
            status.json meta_filtered.json dead_cache.json || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "pipeline: vision+cache+b64 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push origin main
